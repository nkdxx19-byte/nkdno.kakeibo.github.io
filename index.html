<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シンプル家計簿</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --primary: #4CAF50;
    --primary-dark: #388E3C;
    --expense: #f44336;
    --income: #2196F3;
    --transfer: #9e9e9e;
    --bg-body: #f4f7f9;
    --bg-panel: #ffffff;
    --text-main: #333333;
    --text-sub: #666666;
    --border-color: #e0e0e0;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    margin: 0;
    padding: 10px;
    line-height: 1.5;
  }
  .app-container {
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
  }
  h1 { text-align: center; font-size: 1.4em; margin: 10px 0; color: var(--text-main); }

  /* 資産残高パネル */
  .assets-card {
    background: var(--bg-panel); padding: 12px 15px; border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px;
  }
  .assets-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 5px; }
  .assets-title { font-size: 12px; font-weight: bold; color: var(--text-sub); }
  .assets-grid { display: flex; gap: 10px; justify-content: space-between; }
  .asset-item { flex: 1; background: #f8f9fa; padding: 8px; border-radius: 8px; text-align: center; }
  .asset-label { font-size: 10px; color: var(--text-sub); margin-bottom: 2px; }
  .asset-val { font-size: 14px; font-weight: bold; }

  /* 月選択・サマリー */
  .summary-card {
    background: var(--bg-panel); padding: 12px 15px; border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; text-align: center;
  }
  .month-selector { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
  .month-selector button { background: transparent; border: none; font-size: 18px; cursor: pointer; color: var(--text-sub); padding: 5px 10px; }
  .month-selector input[type="month"] { font-size: 16px; font-weight: bold; border: none; background: transparent; outline: none; font-family: inherit; }
  
  .in-out-summary { display: flex; justify-content: space-around; padding-top: 5px; }
  .summary-item { display: flex; flex-direction: column; }
  .summary-label { font-size: 11px; color: var(--text-sub); }
  .summary-val.income { color: var(--income); font-weight: bold; font-size: 16px; }
  .summary-val.expense { color: var(--expense); font-weight: bold; font-size: 16px; }

  /* 入力フォーム */
  .input-card {
    background: var(--bg-panel); padding: 15px; border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px;
    border: 2px solid transparent; transition: border-color 0.3s;
  }
  .input-card.editing { border-color: #ff9800; }
  
  .toggle-group { display: flex; background: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .toggle-group button { flex: 1; padding: 8px; border: none; background: transparent; font-weight: bold; font-size: 13px; color: var(--text-sub); cursor: pointer; transition: 0.2s; }
  
  /* 支出・収入・振替トグル */
  .type-toggle button.active[data-type="expense"] { background: var(--expense); color: white; }
  .type-toggle button.active[data-type="income"] { background: var(--income); color: white; }
  .type-toggle button.active[data-type="transfer"] { background: var(--transfer); color: white; }
  
  /* 口座トグル */
  .account-toggle button.active { background: #607d8b; color: white; }

  .form-group { margin-bottom: 12px; display: flex; gap: 8px; }
  .form-group > div { min-width: 0; } 
  label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
  

  input[type="number"], input[type="text"], input[type="date"], select {
    width: 100%; 
    padding: 10px; 
    border: 1px solid var(--border-color); 
    border-radius: 6px;
    box-sizing: border-box; 
    font-size: 16px;
    font-family: inherit; 
    background: white;
  }
  

  input[type="date"] {
    width: 100%;
    padding: 10px 4px;
    font-size: 14px;
    box-sizing: border-box;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: white;
  }
  
  .form-group > div {
    flex: 1;
    min-width: 0; 
  }
  select { padding: 10px; font-size: 16px; }  
  /* 収支カウント除外チェックボックス用 */
  .checkbox-group {
    display: none; background: #fff3e0; padding: 10px; border-radius: 6px; margin-bottom: 12px;
    border: 1px solid #ffe0b2;
  }
  .checkbox-group label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; font-weight: bold; color: #e65100; cursor: pointer; }
  .checkbox-group input[type="checkbox"] { width: auto; margin: 0; transform: scale(1.2); }
  
  .btn-submit {
    width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
    border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px;
  }
  .btn-submit:active { opacity: 0.8; }
  .btn-submit.edit-mode { background: #ff9800; }
  
  .btn-cancel {
    width: 100%; padding: 10px; background: #e0e0e0; color: #333; border: none;
    border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; display: none;
  }
  .btn-secondary { background: #78909c; color: white; border: none; border-radius: 6px; padding: 10px; cursor: pointer; font-size: 14px; font-weight: bold; }
  .btn-icon-small { background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; color: #333; font-size: 11px; padding: 6px 10px; font-weight: bold; }

  /* タブ切り替え */
  .tabs { display: flex; margin-bottom: 10px; gap: 10px; }
  .tab-btn { flex: 1; padding: 10px; background: #e0e0e0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-sub); }
  .tab-btn.active { background: var(--text-main); color: white; }

  /* 履歴リスト */
  .list-card { background: var(--bg-panel); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
  .list-item:last-child { border-bottom: none; }
  .item-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
  
  .item-color-badge {
    width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
    font-size: 14px; font-weight: bold; color: #333; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1);
  }
  
  .item-details { display: flex; flex-direction: column; min-width: 0; }
  .item-cat { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-memo-date { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; flex-wrap: wrap; gap: 2px;}
  .item-acc-badge { font-size: 9px; background: #eee; padding: 2px 4px; border-radius: 4px; margin-right: 2px; }
  .item-exclude-badge { font-size: 9px; background: #ffe0b2; color: #e65100; border: 1px solid #ffb74d; padding: 1px 4px; border-radius: 4px; margin-right: 2px;}
  
  .item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .item-amount { font-weight: bold; font-size: 15px; text-align: right; }
  .item-amount.expense { color: var(--expense); }
  .item-amount.income { color: var(--income); }
  .item-amount.transfer { color: #333; }
  
  .action-btns { display: flex; gap: 4px; }
  .action-btns button { background: #f0f0f0; border: none; border-radius: 4px; padding: 6px; cursor: pointer; font-size: 12px; }
  .action-btns button.edit { color: #1976D2; }
  .action-btns button.delete { color: var(--danger); }

  /* カテゴリ別集計 */
  .category-summary { padding: 15px; display: none; }
  .cat-bar-container { margin-bottom: 14px; }
  .cat-bar-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; align-items: center; }
  .cat-label-wrap { display: flex; align-items: center; gap: 6px; }
  .cat-small-badge { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.1); }
  .cat-bar-bg { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 4px; }

  .empty-msg { text-align: center; padding: 30px 15px; color: var(--text-sub); font-size: 13px; }

  /* モーダル */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background-color: var(--bg-panel); padding: 20px; border-radius: 12px;
    width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .modal-content h2 { margin: 0 0 15px 0; font-size: 1.1em; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
  
  .cat-edit-list { margin-bottom: 20px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
  .cat-edit-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); background: #fafafa; }
  .cat-edit-item:last-child { border-bottom: none; }
  .cat-edit-item-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }
  .cat-edit-item .btn-delete { color: var(--danger); font-size: 12px; background: #ffebee; border-radius: 4px; padding: 4px 8px; border: none; cursor: pointer; }

  .color-palette { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
  .color-btn { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
  .color-btn.selected { border-color: #333; transform: scale(1.15); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div class="app-container">
  <h1>シンプル家計簿</h1>

  <!-- 資産残高パネル -->
  <div class="assets-card">
    <div class="assets-header">
      <span class="assets-title">💼 資産残高</span>
      <div style="display:flex; gap:6px;">
        <button class="btn-icon-small" onclick="openSubModal()">🔄 サブスク管理</button>
        <button class="btn-icon-small" onclick="openBalanceModal()">⚙️ 初期残高</button>
      </div>
    </div>
    <div class="assets-grid" id="assetsGrid">
      <!-- JSで描画 -->
    </div>
  </div>

  <!-- サマリー（今月の収支） -->
  <div class="summary-card">
    <div class="month-selector">
      <button onclick="changeMonth(-1)">◀</button>
      <input type="month" id="monthInput" onchange="renderData()">
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div style="font-size:12px; color:var(--text-sub); margin-bottom: 5px;">今月の収支（※移動・集計外は含みません）</div>
    <div class="in-out-summary">
      <div class="summary-item">
        <span class="summary-label">収入</span>
        <span id="totalIncome" class="summary-val income">¥0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">支出</span>
        <span id="totalExpense" class="summary-val expense">¥0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">収支</span>
        <span id="monthlyBalance" class="summary-val" style="color:#333;">¥0</span>
      </div>
    </div>
  </div>

  <!-- 入力フォーム -->
  <div class="input-card" id="inputCard">
    <div class="toggle-group type-toggle" id="typeToggle">
      <button class="active" data-type="expense" onclick="setType('expense')">支出</button>
      <button data-type="income" onclick="setType('income')">収入</button>
      <button data-type="transfer" onclick="setType('transfer')">振替(移動)</button>
    </div>
    
    <div class="form-group">
      <div style="flex: 1;">
        <label>日付</label>
        <input type="date" id="inputDate">
      </div>
      <!-- カテゴリ (支出・収入用) -->
      <div style="flex: 1.2;" id="categoryArea">
        <label>カテゴリ</label>
        <div style="display: flex; gap: 5px;">
          <select id="inputCategory"></select>
          <button class="btn-secondary" onclick="openCatModal()" style="padding: 0 10px;" title="カテゴリを編集">⚙️</button>
        </div>
      </div>
    </div>

    <!-- 支払い元 / 入金先の選択 (支出・収入用) -->
    <div id="normalAccountArea">
      <label>支払い元 / 入金先</label>
      <div class="toggle-group account-toggle" id="accountToggle" style="margin-bottom: 12px;">
        <button class="active" data-acc="cash" onclick="setAccount('cash')">手持ち</button>
        <button data-acc="bank" onclick="setAccount('bank')">口座残高</button>
        <button data-acc="savings" onclick="setAccount('savings')">貯金枠</button>
      </div>
    </div>

    <!-- 資金移動の選択 (振替用) -->
    <div id="transferAccountArea" class="form-group" style="display: none; align-items: center; margin-bottom: 12px;">
      <div style="flex: 1;">
        <label>移動元 (出金)</label>
        <select id="transferFrom">
          <option value="cash">手持ち</option>
          <option value="bank" selected>口座残高</option>
          <option value="savings">貯金枠</option>
        </select>
      </div>
      <div style="padding-top: 15px; color: #888; font-weight: bold;">➔</div>
      <div style="flex: 1;">
        <label>移動先 (入金)</label>
        <select id="transferTo">
          <option value="bank">口座残高</option>
          <option value="cash">手持ち</option>
          <option value="savings" selected>貯金枠</option>
        </select>
      </div>
    </div>
    
    <!-- 収入の場合のみ表示される除外設定 -->
    <div class="checkbox-group" id="excludeSummaryArea">
      <label>
        <input type="checkbox" id="inputExclude">
        この収入を今月の「収支(サマリー)」にカウントしない
      </label>
    </div>
    
    <div class="form-group">
      <div style="flex: 1.2;">
        <label>金額 (円)</label>
        <input type="number" id="inputAmount" placeholder="0" min="0">
      </div>
      <div style="flex: 1.8;">
        <label>メモ (任意)</label>
        <input type="text" id="inputMemo" placeholder="立て替え返金など">
      </div>
    </div>
    
    <button class="btn-submit" id="submitBtn" onclick="saveTransaction()">記録する</button>
    <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">編集をキャンセル</button>
  </div>

  <!-- 表示切り替えタブ -->
  <div class="tabs">
    <button class="tab-btn active" id="tabHistory" onclick="switchTab('history')">📜 履歴</button>
    <button class="tab-btn" id="tabCategory" onclick="switchTab('category')">📊 カテゴリ集計</button>
  </div>

  <!-- 履歴・集計 表示エリア -->
  <div class="list-card">
    <div id="historyView"><div id="transactionList"></div></div>
    <div id="categoryView" class="category-summary"><div id="categoryList"></div></div>
  </div>

</div>

<!-- サブスク管理モーダル -->
<div id="subModal" class="modal-overlay">
  <div class="modal-content">
    <h2>🔄 サブスク・固定費の管理</h2>
    <p style="font-size:11px; color:var(--text-sub); margin-top:0;">指定した次回支払日から、設定した頻度に合わせて自動で「支出」に記録されます。</p>
    
    <div class="cat-edit-list" id="subEditList"></div>
    
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
      <label style="font-weight:bold; margin-bottom:8px;">＋ 新しいサブスクを追加</label>
      
      <div class="form-group" style="margin-bottom:8px;">
        <div style="flex: 1.5;">
          <label>サービス名</label>
          <input type="text" id="newSubName" placeholder="例: Netflix, 年会費">
        </div>
        <div style="flex: 1;">
          <label>金額(円)</label>
          <input type="number" id="newSubAmount" placeholder="0" min="0">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:8px;">
        <div style="flex: 1;">
          <label>支払い頻度</label>
          <select id="newSubFrequency">
            <option value="1" selected>毎月</option>
            <option value="3">3カ月ごと</option>
            <option value="6">6カ月ごと</option>
            <option value="12">毎年</option>
          </select>
        </div>
        <div style="flex: 1.2;">
          <label>次回支払日(初回)</label>
          <input type="date" id="newSubDate">
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom: 12px;">
        <div style="flex: 1;">
          <label>支払い元</label>
          <select id="newSubAccount">
            <option value="bank" selected>口座残高</option>
            <option value="cash">手持ち</option>
            <option value="savings">貯金枠</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>カテゴリ</label>
          <select id="newSubCategory"></select>
        </div>
      </div>
      
      <button class="btn-submit" onclick="addNewSub()" style="padding: 10px; font-size: 14px;">このサブスクを登録</button>
    </div>
    
    <button class="btn-secondary" style="width: 100%; margin-top: 15px;" onclick="closeSubModal()">閉じる</button>
  </div>
</div>

<!-- カテゴリ編集モーダル -->
<div id="catModal" class="modal-overlay">
  <div class="modal-content">
    <h2 id="catModalTitle">カテゴリの編集</h2>
    <div class="cat-edit-list" id="catEditList"></div>
    <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
      <label style="font-weight:bold; margin-bottom:8px;">＋ 新しいカテゴリを追加</label>
      <input type="text" id="newCatName" placeholder="新しいカテゴリ名" style="margin-bottom: 10px;">
      <label>テーマカラーを選択</label>
      <div class="color-palette" id="catColorPalette"></div>
      <button class="btn-submit" onclick="addNewCategory()" style="padding: 10px; font-size: 14px;">このカテゴリを追加</button>
    </div>
    <button class="btn-secondary" style="width: 100%; margin-top: 15px;" onclick="closeCatModal()">閉じる</button>
  </div>
</div>

<!-- 初期残高設定モーダル -->
<div id="balanceModal" class="modal-overlay">
  <div class="modal-content">
    <h2>💼 初期残高の基準設定</h2>
    <p style="font-size:12px; color:var(--text-sub); margin-top:0;">現在のリアルな残高を入力してください。ここから日々の記録が自動で足し引きされます。</p>
    
    <div class="form-group" style="display:flex; align-items:center; margin-bottom:10px;">
      <label style="width:70px; margin:0;">手持ち</label>
      <input type="number" id="initCash" placeholder="0">
    </div>
    <div class="form-group" style="display:flex; align-items:center; margin-bottom:10px;">
      <label style="width:70px; margin:0;">口座残高</label>
      <input type="number" id="initBank" placeholder="0">
    </div>
    <div class="form-group" style="display:flex; align-items:center; margin-bottom:15px;">
      <label style="width:70px; margin:0;">貯金枠</label>
      <input type="number" id="initSavings" placeholder="0">
    </div>
    
    <button class="btn-submit" onclick="saveInitialBalances()">保存する</button>
    <button class="btn-cancel" style="display:block; margin-top:10px;" onclick="closeBalanceModal()">キャンセル</button>
  </div>
</div>

<script>
  const PRESET_COLORS = [
    '#ffebee', '#fff3e0', '#fff9c4', '#e8f5e9', '#e3f2fd', '#e8eaf6', '#f3e5f5', '#efebe9', '#f5f5f5'
  ];

  const defaultCategories = {
    expense: [
      { name: '食費', color: '#ffebee' }, { name: '日用品', color: '#fff3e0' }, { name: '交通費', color: '#e8f5e9' },
      { name: '光熱費', color: '#fff9c4' }, { name: '住居費', color: '#e3f2fd' }, { name: '交際費', color: '#f3e5f5' },
      { name: '趣味', color: '#e8eaf6' }, { name: 'その他', color: '#f5f5f5' }
    ],
    income: [
      { name: '給料', color: '#e3f2fd' }, { name: '臨時収入', color: '#fff3e0' }, { name: 'その他', color: '#f5f5f5' }
    ]
  };

  const accountLabels = { 'cash': '手持ち', 'bank': '口座残高', 'savings': '貯金枠' };
  const freqTextMap = { 1: '毎月', 3: '3カ月ごと', 6: '6カ月ごと', 12: '毎年' };

  let userCategories = JSON.parse(localStorage.getItem('kakeiboCategories')) || defaultCategories;
  let transactions = JSON.parse(localStorage.getItem('kakeiboData')) || [];
  let initBalances = JSON.parse(localStorage.getItem('kakeiboBalances')) || { cash: 0, bank: 0, savings: 0 };
  let subscriptions = JSON.parse(localStorage.getItem('kakeiboSubs')) || [];

  let currentType = 'expense';
  let currentAccount = 'cash';
  let selectedNewColor = PRESET_COLORS[0];
  let editingId = null; 

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('monthInput').value = `${yyyy}-${mm}`;

  // --- 初期化＆サブスク自動処理 ---
  function init() {
    processSubscriptions(); 
    updateCategorySelect();
    renderData();
  }

  function processSubscriptions() {
    const todayObj = new Date();
    todayObj.setHours(0,0,0,0);
    let updated = false;

    subscriptions.forEach(sub => {
      let billingDate = new Date(sub.nextYear, sub.nextMonth - 1, sub.billingDay);
      const freq = parseInt(sub.frequency || 1, 10); 
      
      let loopCount = 0;
      // 次回支払日が今日以前になっていたら計上する
      while (billingDate <= todayObj && loopCount < 24) {
        const actualY = billingDate.getFullYear();
        const actualM = String(billingDate.getMonth() + 1).padStart(2, '0');
        const actualD = String(billingDate.getDate()).padStart(2, '0');

        const t = {
          id: Date.now() + Math.floor(Math.random() * 10000),
          type: 'expense',
          accountId: sub.accountId,
          date: `${actualY}-${actualM}-${actualD}`,
          category: sub.category,
          amount: sub.amount,
          memo: `[固定] ${sub.name}`,
          excludeFromSummary: false
        };
        transactions.push(t);
        updated = true;

        // 指定された頻度の月数を足して次回支払日をセット
        sub.nextMonth += freq;
        while (sub.nextMonth > 12) {
          sub.nextMonth -= 12; 
          sub.nextYear++;
        }
        billingDate = new Date(sub.nextYear, sub.nextMonth - 1, sub.billingDay);
        loopCount++;
      }
    });

    if (updated) {
      localStorage.setItem('kakeiboData', JSON.stringify(transactions));
      localStorage.setItem('kakeiboSubs', JSON.stringify(subscriptions));
    }
  }

  // --- UI操作 ---
  function setType(type) {
    currentType = type;
    document.querySelectorAll('.type-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.type === type);
    });

    const catArea = document.getElementById('categoryArea');
    const normalAccArea = document.getElementById('normalAccountArea');
    const transAccArea = document.getElementById('transferAccountArea');
    const excludeArea = document.getElementById('excludeSummaryArea');

    if (type === 'transfer') {
      catArea.style.display = 'none'; normalAccArea.style.display = 'none';
      transAccArea.style.display = 'flex'; excludeArea.style.display = 'none';
    } else if (type === 'income') {
      catArea.style.display = 'block'; normalAccArea.style.display = 'block';
      transAccArea.style.display = 'none'; excludeArea.style.display = 'block'; 
      updateCategorySelect();
    } else {
      catArea.style.display = 'block'; normalAccArea.style.display = 'block';
      transAccArea.style.display = 'none'; excludeArea.style.display = 'none';
      document.getElementById('inputExclude').checked = false; 
      updateCategorySelect();
    }
  }

  function setAccount(acc) {
    currentAccount = acc;
    document.querySelectorAll('.account-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.acc === acc);
    });
  }

  function updateCategorySelect(selectedValue = null) {
    if (currentType === 'transfer') return;
    const select = document.getElementById('inputCategory');
    select.innerHTML = '';
    userCategories[currentType].forEach(cat => {
      let opt = document.createElement('option');
      opt.value = cat.name; opt.textContent = cat.name;
      select.appendChild(opt);
    });
    if (selectedValue) select.value = selectedValue;
  }

  function changeMonth(delta) {
    const input = document.getElementById('monthInput');
    const [y, m] = input.value.split('-').map(Number);
    let date = new Date(y, m - 1 + delta, 1);
    const newY = date.getFullYear();
    const newM = String(date.getMonth() + 1).padStart(2, '0');
    input.value = `${newY}-${newM}`;
    renderData();
  }

  function switchTab(tab) {
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    document.getElementById('tabCategory').classList.toggle('active', tab === 'category');
    document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
    document.getElementById('categoryView').style.display = tab === 'category' ? 'block' : 'none';
  }

  function getCategoryColor(type, name) {
    const catList = userCategories[type] || [];
    const found = catList.find(c => c.name === name);
    return found ? found.color : '#e0e0e0';
  }

  // --- 記録・編集・削除処理 ---
  function saveTransaction() {
    const date = document.getElementById('inputDate').value;
    const amount = parseInt(document.getElementById('inputAmount').value, 10);
    const memo = document.getElementById('inputMemo').value.trim();
    const excludeFromSummary = (currentType === 'income') ? document.getElementById('inputExclude').checked : false;

    if (!date || isNaN(amount) || amount <= 0) {
      alert("日付と金額を正しく入力してください。"); return;
    }

    let t = { id: editingId ? editingId : Date.now(), type: currentType, date, amount, memo, excludeFromSummary };

    if (currentType === 'transfer') {
      const fromAcc = document.getElementById('transferFrom').value;
      const toAcc = document.getElementById('transferTo').value;
      if (fromAcc === toAcc) { alert("移動元と移動先が同じです。異なる場所を選択してください。"); return; }
      t.fromAcc = fromAcc; t.toAcc = toAcc; t.category = '資金移動';
    } else {
      const category = document.getElementById('inputCategory').value;
      if (!category) { alert("カテゴリを選択してください。"); return; }
      t.accountId = currentAccount; t.category = category;
    }

    if (editingId) {
      const index = transactions.findIndex(x => x.id === editingId);
      if (index !== -1) transactions[index] = t;
      cancelEdit(); 
    } else {
      transactions.push(t);
      document.getElementById('inputAmount').value = '';
      document.getElementById('inputMemo').value = '';
      document.getElementById('inputExclude').checked = false;
    }

    localStorage.setItem('kakeiboData', JSON.stringify(transactions));
    document.getElementById('monthInput').value = date.substring(0, 7);
    renderData();
  }

  function editTransaction(id) {
    const t = transactions.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    setType(t.type);
    if (t.type === 'transfer') {
      document.getElementById('transferFrom').value = t.fromAcc;
      document.getElementById('transferTo').value = t.toAcc;
    } else {
      updateCategorySelect(t.category); setAccount(t.accountId || 'cash'); 
      if (t.type === 'income') document.getElementById('inputExclude').checked = !!t.excludeFromSummary;
    }
    document.getElementById('inputDate').value = t.date;
    document.getElementById('inputAmount').value = t.amount;
    document.getElementById('inputMemo').value = t.memo;

    const card = document.getElementById('inputCard');
    card.classList.add('editing');
    document.getElementById('submitBtn').textContent = '更新する';
    document.getElementById('submitBtn').classList.add('edit-mode');
    document.getElementById('cancelBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('inputAmount').value = ''; document.getElementById('inputMemo').value = '';
    document.getElementById('inputExclude').checked = false;
    const card = document.getElementById('inputCard');
    card.classList.remove('editing');
    document.getElementById('submitBtn').textContent = '記録する';
    document.getElementById('submitBtn').classList.remove('edit-mode');
    document.getElementById('cancelBtn').style.display = 'none';
  }

  function deleteTransaction(id) {
    if(confirm('この記録を削除しますか？')) {
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('kakeiboData', JSON.stringify(transactions));
      if (editingId === id) cancelEdit();
      renderData();
    }
  }

  // --- 描画処理 ---
  function renderData() {
    renderAssets(); 

    const currentMonth = document.getElementById('monthInput').value; 
    const monthlyData = transactions.filter(t => t.date.startsWith(currentMonth));
    monthlyData.sort((a, b) => new Date(b.date) - new Date(a.date));

    let income = 0, expense = 0;
    const categoryTotals = {}; 
    const listDiv = document.getElementById('transactionList');
    listDiv.innerHTML = '';

    if (monthlyData.length === 0) {
      listDiv.innerHTML = `<div class="empty-msg">この月の記録はありません。<br>上のフォームから入力してください。</div>`;
    } else {
      monthlyData.forEach(t => {
        const isTransfer = t.type === 'transfer';
        if (!isTransfer && !t.excludeFromSummary) {
          if (t.type === 'income') income += t.amount;
          if (t.type === 'expense') {
            expense += t.amount;
            categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
          }
        }

        const catColor = isTransfer ? '#e0e0e0' : getCategoryColor(t.type, t.category);
        const firstChar = isTransfer ? '🔄' : Array.from(t.category)[0];
        const sign = t.type === 'expense' ? '-' : (t.type === 'income' ? '+' : '');
        const dateStr = t.date.split('-').slice(1).join('/');
        
        let displayCat = t.category;
        let displayAcc = isTransfer ? `${accountLabels[t.fromAcc]} ➔ ${accountLabels[t.toAcc]}` : accountLabels[t.accountId || 'cash'];
        const excludeBadge = t.excludeFromSummary ? `<span class="item-exclude-badge">集計外</span>` : '';
        const memoHtml = t.memo ? `<span style="margin-left: 2px;">- ${t.memo}</span>` : '';

        listDiv.innerHTML += `
          <div class="list-item">
            <div class="item-info">
              <div class="item-color-badge" style="background-color: ${catColor}; border: ${isTransfer ? 'none' : '1px solid rgba(0,0,0,0.1)'}">${firstChar}</div>
              <div class="item-details">
                <span class="item-cat">${displayCat}</span>
                <div class="item-memo-date">
                  <span class="item-acc-badge" style="${isTransfer ? 'background:#e3f2fd;' : ''}">${displayAcc}</span>
                  ${excludeBadge}${dateStr}${memoHtml}
                </div>
              </div>
            </div>
            <div class="item-right">
              <span class="item-amount ${t.type}">${sign}¥${t.amount.toLocaleString()}</span>
              <div class="action-btns">
                <button class="edit" onclick="editTransaction(${t.id})">✏️</button>
                <button class="delete" onclick="deleteTransaction(${t.id})">✖</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('totalIncome').textContent = `¥${income.toLocaleString()}`;
    document.getElementById('totalExpense').textContent = `¥${expense.toLocaleString()}`;
    const monthlyBal = income - expense;
    const mBalEl = document.getElementById('monthlyBalance');
    mBalEl.textContent = `¥${monthlyBal.toLocaleString()}`;
    mBalEl.style.color = monthlyBal >= 0 ? 'var(--income)' : 'var(--expense)';

    renderCategorySummary(categoryTotals, expense);
  }

  function renderAssets() {
    let currentCash = initBalances.cash; let currentBank = initBalances.bank; let currentSavings = initBalances.savings;
    transactions.forEach(t => {
      if (t.type === 'transfer') {
        if (t.fromAcc === 'cash') currentCash -= t.amount;
        if (t.fromAcc === 'bank') currentBank -= t.amount;
        if (t.fromAcc === 'savings') currentSavings -= t.amount;
        
        if (t.toAcc === 'cash') currentCash += t.amount;
        if (t.toAcc === 'bank') currentBank += t.amount;
        if (t.toAcc === 'savings') currentSavings += t.amount;
      } else {
        const acc = t.accountId || 'cash';
        if (t.type === 'income') {
          if (acc === 'cash') currentCash += t.amount;
          if (acc === 'bank') currentBank += t.amount;
          if (acc === 'savings') currentSavings += t.amount;
        } else if (t.type === 'expense') {
          if (acc === 'cash') currentCash -= t.amount;
          if (acc === 'bank') currentBank -= t.amount;
          if (acc === 'savings') currentSavings -= t.amount;
        }
      }
    });

    document.getElementById('assetsGrid').innerHTML = `
      <div class="asset-item"><div class="asset-label">手持ち</div><div class="asset-val" style="color:#333;">¥${currentCash.toLocaleString()}</div></div>
      <div class="asset-item"><div class="asset-label">口座残高</div><div class="asset-val" style="color:#1976D2;">¥${currentBank.toLocaleString()}</div></div>
      <div class="asset-item"><div class="asset-label">貯金枠</div><div class="asset-val" style="color:#388E3C;">¥${currentSavings.toLocaleString()}</div></div>
    `;
  }

  function renderCategorySummary(catTotals, totalExpense) {
    const catDiv = document.getElementById('categoryList'); catDiv.innerHTML = '';
    if (totalExpense === 0) { catDiv.innerHTML = `<div class="empty-msg">支出データがありません。</div>`; return; }
    const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
    sortedCats.forEach(([catName, amount]) => {
      const percent = Math.round((amount / totalExpense) * 100);
      const catColor = getCategoryColor('expense', catName);
      catDiv.innerHTML += `
        <div class="cat-bar-container">
          <div class="cat-bar-header">
            <div class="cat-label-wrap"><div class="cat-small-badge" style="background-color: ${catColor};"></div><span>${catName}</span></div>
            <span>¥${amount.toLocaleString()} <span style="color:#888; font-size:11px;">(${percent}%)</span></span>
          </div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width: ${percent}%; background-color: ${catColor};"></div></div>
        </div>
      `;
    });
  }

  // --- サブスク管理モーダル ---
  function openSubModal() {
    renderSubList();
    
    // 日付の初期値を今日にセット
    const t = new Date();
    const y = t.getFullYear();
    const m = String(t.getMonth() + 1).padStart(2, '0');
    const d = String(t.getDate()).padStart(2, '0');
    document.getElementById('newSubDate').value = `${y}-${m}-${d}`;
    
    const select = document.getElementById('newSubCategory'); select.innerHTML = '';
    userCategories['expense'].forEach(cat => {
      let opt = document.createElement('option'); opt.value = cat.name; opt.textContent = cat.name; select.appendChild(opt);
    });
    document.getElementById('subModal').classList.add('active');
  }
  
  function closeSubModal() { document.getElementById('subModal').classList.remove('active'); }
  
  function renderSubList() {
    const listDiv = document.getElementById('subEditList'); listDiv.innerHTML = '';
    if (subscriptions.length === 0) {
      listDiv.innerHTML = `<div style="padding:15px; text-align:center; font-size:12px; color:#888;">登録されているサブスクはありません。</div>`; return;
    }
    subscriptions.forEach(sub => {
      const freqText = freqTextMap[sub.frequency || 1];
      const nextDateStr = `${sub.nextYear}年${sub.nextMonth}月${sub.billingDay}日`;
      
      listDiv.innerHTML += `
        <div class="cat-edit-item" style="padding: 12px 10px;">
          <div class="cat-edit-item-left" style="flex-direction: column; align-items: flex-start; gap: 4px;">
            <div style="font-size:14px; font-weight:bold;">${sub.name} <span style="font-size:11px; color:#888; font-weight:normal;">(${freqText} / 次回: ${nextDateStr})</span></div>
            <div style="font-size:11px; font-weight:normal; color:#666;">
              <span class="item-acc-badge">${accountLabels[sub.accountId]}</span> ¥${sub.amount.toLocaleString()} / ${sub.category}
            </div>
          </div>
          <button class="btn-delete" onclick="deleteSub(${sub.id})">削除</button>
        </div>
      `;
    });
  }

  function addNewSub() {
    const name = document.getElementById('newSubName').value.trim();
    const amount = parseInt(document.getElementById('newSubAmount').value, 10);
    const dateVal = document.getElementById('newSubDate').value;
    const accountId = document.getElementById('newSubAccount').value;
    const category = document.getElementById('newSubCategory').value;
    const frequency = parseInt(document.getElementById('newSubFrequency').value, 10);

    if (!name || isNaN(amount) || amount <= 0 || !dateVal) {
      alert("正しく入力してください。次回支払日は必須です。"); return;
    }

    const [y, m, d] = dateVal.split('-').map(Number);

    const sub = { 
      id: Date.now(), 
      name, 
      amount, 
      billingDay: d, 
      accountId, 
      category, 
      frequency, 
      nextYear: y, 
      nextMonth: m 
    };
    
    subscriptions.push(sub);
    localStorage.setItem('kakeiboSubs', JSON.stringify(subscriptions));

    document.getElementById('newSubName').value = '';
    document.getElementById('newSubAmount').value = '';
    document.getElementById('newSubFrequency').value = '1';
    
    renderSubList();
    alert(`「${name}」を登録しました。\n${y}年${m}月${d}日から、指定した頻度で自動記録されます。`);
  }

  function deleteSub(id) {
    if (confirm("この設定を削除しますか？\n（過去に自動記録された支出履歴は消えません）")) {
      subscriptions = subscriptions.filter(s => s.id !== id);
      localStorage.setItem('kakeiboSubs', JSON.stringify(subscriptions));
      renderSubList();
    }
  }

  // --- 初期残高設定モーダル ---
  function openBalanceModal() {
    document.getElementById('initCash').value = initBalances.cash; document.getElementById('initBank').value = initBalances.bank; document.getElementById('initSavings').value = initBalances.savings;
    document.getElementById('balanceModal').classList.add('active');
  }
  function closeBalanceModal() { document.getElementById('balanceModal').classList.remove('active'); }
  function saveInitialBalances() {
    initBalances.cash = parseInt(document.getElementById('initCash').value, 10) || 0; initBalances.bank = parseInt(document.getElementById('initBank').value, 10) || 0; initBalances.savings = parseInt(document.getElementById('initSavings').value, 10) || 0;
    localStorage.setItem('kakeiboBalances', JSON.stringify(initBalances)); renderAssets(); closeBalanceModal();
  }

  // --- カテゴリ編集モーダル ---
  function setupColorPalette() {
    const palette = document.getElementById('catColorPalette'); palette.innerHTML = '';
    PRESET_COLORS.forEach((color, index) => {
      let btn = document.createElement('div'); btn.className = 'color-btn'; btn.style.backgroundColor = color;
      if (index === 0) btn.classList.add('selected'); btn.onclick = () => selectColor(color, btn); palette.appendChild(btn);
    });
  }
  function selectColor(color, btnElement) {
    selectedNewColor = color; document.querySelectorAll('.color-palette .color-btn').forEach(b => b.classList.remove('selected')); btnElement.classList.add('selected');
  }
  function openCatModal() {
    document.getElementById('catModalTitle').textContent = currentType === 'expense' ? '支出カテゴリの編集' : '収入カテゴリの編集';
    renderCatEditList(); setupColorPalette(); document.getElementById('newCatName').value = ''; document.getElementById('catModal').classList.add('active');
  }
  function closeCatModal() { document.getElementById('catModal').classList.remove('active'); }
  
  function renderCatEditList() {
    const listDiv = document.getElementById('catEditList'); listDiv.innerHTML = '';
    userCategories[currentType].forEach((cat, index) => {
      const firstChar = Array.from(cat.name)[0];
      listDiv.innerHTML += `
        <div class="cat-edit-item">
          <div class="cat-edit-item-left">
            <div class="item-color-badge" style="width: 28px; height: 28px; font-size: 12px; background-color: ${cat.color};">${firstChar}</div>${cat.name}
          </div>
          <button class="btn-delete" onclick="deleteCategory(${index})">削除</button>
        </div>
      `;
    });
  }
  function addNewCategory() {
    const name = document.getElementById('newCatName').value.trim();
    if (!name) return alert('カテゴリ名を入力してください。');
    if (userCategories[currentType].find(c => c.name === name)) return alert('そのカテゴリはすでに存在します。');
    userCategories[currentType].push({ name: name, color: selectedNewColor });
    saveCategories(); document.getElementById('newCatName').value = ''; renderCatEditList(); updateCategorySelect(); renderData();
  }
  function deleteCategory(index) {
    if (userCategories[currentType].length <= 1) return alert('カテゴリは最低1つ必要です。');
    if (confirm('このカテゴリを削除しますか？')) { userCategories[currentType].splice(index, 1); saveCategories(); renderCatEditList(); updateCategorySelect(); renderData(); }
  }
  function saveCategories() { localStorage.setItem('kakeiboCategories', JSON.stringify(userCategories)); }

  // 起動時の実行
  init();

</script>
</body>
